<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DarpasyanGram</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            background: #f0f2f5;
        }

        /* SIDEBAR */
        #sidebar {
            width: 300px;
            border-right: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }

        #sidebar h2 {
            text-align: center;
            padding: 10px;
            background: #4267B2;
            color: white;
            margin: 0;
        }

        #myDirects {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        #myDirects li {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        #myDirects li:hover {
            background: #ddd;
        }

        /* CHAT AREA */
        #chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background: #fff;
        }

        .message {
            margin-bottom: 10px;
            padding: 5px 10px;
            border-radius: 10px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message.me {
            background: #DCF8C6;
            align-self: flex-end;
        }

        .message.other {
            background: #eee;
            align-self: flex-start;
        }

        #inputArea {
            display: flex;
            padding: 10px;
            background: #f5f5f5;
            border-top: 1px solid #ccc;
        }

        #newMessage {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
        }

        #sendMessage {
            margin-left: 10px;
            padding: 0 20px;
            border: none;
            border-radius: 20px;
            background: #4267B2;
            color: white;
            cursor: pointer;
        }

        #sendMessage:hover {
            background: #365899;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>DarpasyanGram</h2>
    <form id="loginForm" style="padding:10px;">
        <input id="username" type="text" placeholder="Username" style="width:100%;margin-bottom:5px;">
        <input id="password" type="password" placeholder="Password" style="width:100%;margin-bottom:5px;">
        <button type="submit" style="width:100%;">Login</button>
    </form>
    <ul id="myDirects"></ul>
</div>

<div id="chat">
    <div id="messages"></div>
    <div id="inputArea">
        <input id="newMessage" type="text" placeholder="Type a message">
        <button id="sendMessage">Send</button>
        <input type="file" id="attachImage" style="margin-left:10px;">
    </div>
</div>

<script>
    let auth;
    let currentUserId;
    let activeDirectId;

    // Ссылки на элементы
    const directsList = document.getElementById("myDirects");
    const messagesContainer = document.getElementById("messages");
    const newMessageInput = document.getElementById("newMessage");
    const sendMessageBtn = document.getElementById("sendMessage");
    const attachImageInput = document.getElementById("attachImage");

    document.getElementById("loginForm").addEventListener("submit", e => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        auth = btoa(username + ":" + password);

        // Получаем currentUser
        fetch("http://localhost:8080/api/me", {
            headers: { "Authorization": "Basic " + auth }
        })
            .then(res => res.json())
            .then(user => {
                currentUserId = user.id;
                loadDirects();
            })
            .catch(err => alert("Auth failed"));
    });

    // Загрузка списка директов
    function loadDirects() {
        directsList.innerHTML = "";
        fetch("http://localhost:8080/api/myDirects", {
            headers: { "Authorization": "Basic " + auth }
        })
            .then(res => res.json())
            .then(data => {
                data.forEach(direct => {
                    const li = document.createElement("li");
                    li.textContent = direct.sender.id === currentUserId
                        ? direct.recipient.username
                        : direct.sender.username;
                    li.dataset.directId = direct.id;
                    li.dataset.otherUserId = direct.sender.id === currentUserId
                        ? direct.recipient.id
                        : direct.sender.id;

                    directsList.appendChild(li);

                    li.addEventListener("click", () => {
                        activeDirectId = direct.id;
                        loadMessages(direct.id);
                    });
                });
            })
            .catch(console.error);
    }

    // Загрузка сообщений активного директa
    function loadMessages(directId) {
        messagesContainer.innerHTML = "";

        fetch(`http://localhost:8080/api/directs/${directId}/messages`, {
            headers: { "Authorization": "Basic " + auth }
        })
            .then(res => res.json())
            .then(data => {
                // безопасно определяем массив сообщений
                const messages = Array.isArray(data) ? data : (data.messages || []);

                messages.forEach(msg => {
                    if(!msg.sender) return;

                    const div = document.createElement("div");
                    div.className = "message " + (msg.sender.id === currentUserId ? "me" : "other");
                    div.textContent = msg.sender.username + ": " + (msg.content || "");

                    // картинки
                    if(msg.images && msg.images.length) {
                        msg.images.forEach(img => {
                            if(img && img.url) {
                                const imageEl = document.createElement("img");
                                imageEl.src = img.url;
                                imageEl.style.maxWidth = "200px";
                                imageEl.style.display = "block";
                                imageEl.style.marginTop = "5px";
                                div.appendChild(imageEl);
                            }
                        });
                    }

                    messagesContainer.appendChild(div);
                });

                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            })
            .catch(err => console.error(err));
    }



    // Отправка нового сообщения
    sendMessageBtn.addEventListener("click", () => {
        const content = newMessageInput.value.trim();
        if(!content || !activeDirectId) return;

        fetch(`http://localhost:8080/api/directs/${activeDirectId}/createMessage`, {
            method: "POST",
            headers: {
                "Authorization": "Basic " + auth,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ content })
        })
            .then(() => {
                newMessageInput.value = "";
                loadMessages(activeDirectId);
            })
            .catch(console.error);
    });

    // Прикрепление изображения
    attachImageInput.addEventListener("change", () => {
        if(!activeDirectId || !attachImageInput.files.length) return;
        const file = attachImageInput.files[0];

        // создаём пустое сообщение для привязки изображения
        fetch(`http://localhost:8080/api/directs/${activeDirectId}/createMessage`, {
            method: "POST",
            headers: {
                "Authorization": "Basic " + auth,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ content: "" })
        })
            .then(res => res.json())
            .then(msg => {
                const formData = new FormData();
                formData.append("file", file);
                fetch(`http://localhost:8080/api/uploadDirectImage/${msg.id}`, {
                    method: "POST",
                    headers: { "Authorization": "Basic " + auth },
                    body: formData
                }).then(() => loadMessages(activeDirectId));
            });
    });
</script>

</body>
</html>
